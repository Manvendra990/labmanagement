services:
  mysql:
    build:
      context: .
      dockerfile: database/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lab_lims
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data: